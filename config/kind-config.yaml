---
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # NodePorts published on the host. kube-proxy forwards a NodePort on any
    # node, so mapping them on the control plane is enough.
    extraPortMappings:
      # Argo CD UI (argocd-server NodePort)
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      # Headlamp UI
      - containerPort: 30090
        hostPort: 30090
        protocol: TCP
      # Traefik HTTP, so http://<app>.localhost:8080 reaches your Ingresses
      - containerPort: 30081
        hostPort: 8080
        protocol: TCP
      # Traefik HTTPS
      - containerPort: 30444
        hostPort: 8443
        protocol: TCP
  - role: worker
